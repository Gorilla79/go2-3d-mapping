<title id="t">Point-to-plane residual (schematic)</title>
<desc id="d">A scan point p_W,j transformed into the world frame lies above a local map surface. Its five nearest map neighbours define a plane with unit normal n_j through q_j. The residual r_j is the signed distance from the point to the plane along n_j.</desc>
