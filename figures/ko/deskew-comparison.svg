<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="t d">
<title id="t">LiDAR 움직임 왜곡과 왜곡 보정(개념도)</title>
<desc id="d">왼쪽: 한 번의 스캔 동안 로봇이 이동하며 회전하므로 곧은 벽 위의 점들이 서로 다른 자세에서 측정되어 휘어 보인다. 오른쪽: 각 점을 측정 시각의 IMU 전파 포즈로 스캔 끝 시각에 옮기면 벽이 다시 곧아진다. 실측 데이터가 아니다.</desc>
