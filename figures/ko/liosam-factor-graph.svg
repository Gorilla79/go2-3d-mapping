<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 520" width="1320" height="520" role="img" aria-labelledby="t d">
<title id="t">LIO-SAM 팩터 그래프(개념도)</title>
<desc id="d">키프레임 상태 변수 X0–X4가 한 줄로 있고, 이웃한 상태는 위쪽의 IMU 사전적분 팩터와 아래쪽의 LiDAR 오도메트리 팩터로 연결된다. X0에는 사전 팩터가 있고, 점선의 루프 클로저 팩터가 X4를 X0에 연결한다. 회색 GPS 팩터는 사용하지 않음을 나타낸다.</desc>
