<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 520" width="1320" height="520" role="img" aria-labelledby="t d">
<title id="t">LIO-SAM factor graph (schematic)</title>
<desc id="d">Keyframe state variables X0 to X4 in a row. Consecutive states are joined by IMU preintegration factors above and LiDAR odometry factors below. X0 has a prior factor. A dashed loop-closure factor links X4 back to X0. A greyed GPS factor is shown as supported by the algorithm but not used for this dataset.</desc>
