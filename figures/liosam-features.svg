<title id="t">Edge and planar features (schematic)</title>
<desc id="d">Top-down view of a LiDAR scan ring crossing two walls that meet at a corner and a door frame. Points with high local curvature near the corner and the frame are edge features; points along the flat walls with low curvature are planar features.</desc>
