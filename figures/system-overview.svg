<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="t d">
<title id="t">System overview (schematic)</title>
<desc id="d">Unitree Go2 quadruped carrying a Hesai XT16 LiDAR above its built-in IMU. LiDAR points and IMU samples, related by the fixed extrinsic T_IL, flow into a LiDAR-inertial pipeline (FAST-LIO for 2F, 3F, 6F, 8F; LIO-SAM for 4F), which outputs a pose estimate and a point-cloud map.</desc>
